<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlanTogether - Group Vacation Planner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script crossorigin src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-orange-50 via-amber-50 to-stone-100 min-h-screen text-stone-800 antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const INITIAL_MEMBERS = [];

        const formatDateKey = (date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const generateSeasonDates = () => {
            const dates = [];
            const current = new Date(2027, 4, 1); // May 1, 2027
            const end = new Date(2027, 9, 31);   // October 31, 2027
            
            while (current <= end) {
                dates.push(new Date(current));
                current.setDate(current.getDate() + 1);
            }
            return dates;
        };

        const SEASON_DATES = generateSeasonDates();

        function App() {
            const [members, setMembers] = useState(() => {
                const saved = localStorage.getItem('plantogether_members');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { console.error(e); }
                }
                return INITIAL_MEMBERS;
            });

            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('plantogether_current_user');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { console.error(e); }
                }
                return null;
            });

            const [activeTab, setActiveTab] = useState('calendar'); // 'calendar', 'dashboard', 'finder'
            const [loginNameInput, setLoginNameInput] = useState('');
            const [selectedMonth, setSelectedMonth] = useState(4); // 4 = May 2027
            const [successMessage, setSuccessMessage] = useState('');
            const [activeModal, setActiveModal] = useState(null); // 'userMenu', 'resetConfirm'

            // Finder Filter States
            const [minDuration, setMinDuration] = useState(3); // 3, 5, 7, 10, 14
            const [minAttendance, setMinAttendance] = useState('all'); // 'all', '5', '4'

            useEffect(() => {
                localStorage.setItem('plantogether_members', JSON.stringify(members));
            }, [members]);

            useEffect(() => {
                if (currentUser) {
                    localStorage.setItem('plantogether_current_user', JSON.stringify(currentUser));
                } else {
                    localStorage.removeItem('plantogether_current_user');
                }
            }, [currentUser]);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, currentUser, activeModal, selectedMonth, minDuration, minAttendance, members]);

            const handleLogin = (e) => {
                e.preventDefault();
                const trimmedName = loginNameInput.trim();
                if (!trimmedName) return;

                let existing = members.find(m => m.name.toLowerCase() === trimmedName.toLowerCase());
                if (!existing) {
                    const newMember = {
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                        name: trimmedName,
                        avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(trimmedName)}`,
                        unavailableDates: []
                    };
                    const updatedMembers = [...members, newMember];
                    setMembers(updatedMembers);
                    existing = newMember;
                }
                setCurrentUser(existing);
                setLoginNameInput('');
                setActiveTab('calendar');
                triggerToast(`Welcome, ${existing.name}!`);
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setActiveTab('calendar');
                setActiveModal(null);
                triggerToast('Logged out successfully.');
            };

            const triggerToast = (msg) => {
                setSuccessMessage(msg);
                setTimeout(() => setSuccessMessage(''), 3500);
            };

            // 100% Reliable Single Click / Tap to Toggle (Add or Undo Unavailability)
            const toggleDateUnavailability = (dateStr) => {
                if (!currentUser) return;

                const updatedUnavailable = currentUser.unavailableDates.includes(dateStr)
                    ? currentUser.unavailableDates.filter(d => d !== dateStr)
                    : [...currentUser.unavailableDates, dateStr];

                const updatedUser = { ...currentUser, unavailableDates: updatedUnavailable };
                setCurrentUser(updatedUser);
                setMembers(members.map(m => m.id === updatedUser.id ? updatedUser : m));
            };

            const handleQuickUnavailable = (type) => {
                if (!currentUser) return;
                let newDates = [...currentUser.unavailableDates];
                
                if (type === 'clear') {
                    newDates = [];
                } else if (type === 'weekends') {
                    SEASON_DATES.forEach(d => {
                        const dayOfWeek = d.getDay();
                        if (dayOfWeek === 0 || dayOfWeek === 6) {
                            const ds = formatDateKey(d);
                            if (!newDates.includes(ds)) newDates.push(ds);
                        }
                    });
                }

                const updatedUser = { ...currentUser, unavailableDates: newDates };
                setCurrentUser(updatedUser);
                setMembers(members.map(m => m.id === updatedUser.id ? updatedUser : m));
                triggerToast(type === 'clear' ? 'Cleared all unavailable dates!' : 'Marked all weekends as unavailable.');
            };

            const handleDeleteUser = (memberId, memberName, e) => {
                e.stopPropagation();
                const updatedMembers = members.filter(m => m.id !== memberId);
                setMembers(updatedMembers);
                triggerToast(`Deleted user ${memberName}`);

                if (currentUser && currentUser.id === memberId) {
                    setCurrentUser(null);
                }
            };

            const handleResetAll = () => {
                if (!currentUser || currentUser.name.toLowerCase() !== 'admin') return;
                localStorage.clear();
                setMembers(INITIAL_MEMBERS);
                setCurrentUser(null);
                setActiveModal(null);
                triggerToast('Reset application to default state.');
            };

            const commonDateRanges = useMemo(() => {
                const totalMembers = members.length;
                if (totalMembers === 0) return [];

                const unavailableCountMap = {};
                SEASON_DATES.forEach(d => {
                    const ds = formatDateKey(d);
                    const count = members.filter(m => m.unavailableDates && m.unavailableDates.includes(ds)).length;
                    unavailableCountMap[ds] = count;
                });

                let maxUnavailableAllowed = 0;
                if (minAttendance === 'all') maxUnavailableAllowed = 0;
                else if (minAttendance === '5') maxUnavailableAllowed = Math.max(0, totalMembers - 5);
                else if (minAttendance === '4') maxUnavailableAllowed = Math.max(0, totalMembers - 4);

                let eligibleDates = SEASON_DATES.filter(d => unavailableCountMap[formatDateKey(d)] <= maxUnavailableAllowed);

                if (eligibleDates.length === 0) return [];

                const ranges = [];
                let start = eligibleDates[0];
                let prev = eligibleDates[0];

                for (let i = 1; i < eligibleDates.length; i++) {
                    const curr = eligibleDates[i];
                    const diffTime = Math.abs(curr - prev);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    if (diffDays === 1) {
                        prev = curr;
                    } else {
                        const duration = Math.round((prev - start) / (1000 * 60 * 60 * 24)) + 1;
                        ranges.push({ start, end: prev, count: duration, unavailableMap: unavailableCountMap });
                        start = curr;
                        prev = curr;
                    }
                }
                const finalDuration = Math.round((prev - start) / (1000 * 60 * 60 * 24)) + 1;
                ranges.push({ start, end: prev, count: finalDuration, unavailableMap: unavailableCountMap });

                const filteredRanges = ranges.filter(r => r.count >= minDuration);

                return filteredRanges.sort((a, b) => b.count - a.count);
            }, [members, minDuration, minAttendance]);

            if (!currentUser) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-orange-100 via-amber-50 to-orange-200">
                        <div className="max-w-md w-full bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-8 border border-orange-100">
                            <div className="text-center mb-8">
                                <div className="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-orange-500 to-amber-400 text-white rounded-2xl shadow-lg mb-4 transform rotate-3">
                                    <i data-lucide="palmtree" className="w-10 h-10"></i>
                                </div>
                                <h1 className="text-3xl font-extrabold text-stone-900 tracking-tight">PlanTogether</h1>
                                <p className="text-stone-500 mt-2 text-sm">Find the perfect summer & fall vacation dates for your crew (May - Oct 2027)</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>
                                    <label className="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-2">Your Full Name</label>
                                    <div className="relative">
                                        <span className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-stone-400">
                                            <i data-lucide="user" className="w-5 h-5"></i>
                                        </span>
                                        <input
                                            type="text"
                                            required
                                            value={loginNameInput}
                                            onChange={(e) => setLoginNameInput(e.target.value)}
                                            placeholder="e.g. Alex Rivera"
                                            className="w-full pl-12 pr-4 py-3.5 bg-stone-50 border border-stone-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white text-stone-800 font-medium text-base"
                                        />
                                    </div>
                                </div>

                                <button
                                    type="submit"
                                    className="w-full py-4 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-2xl shadow-lg shadow-orange-500/30 hover:shadow-xl transition-all flex items-center justify-center space-x-2 text-base"
                                >
                                    <span>Enter Vacation Planner</span>
                                    <i data-lucide="arrow-right" className="w-5 h-5"></i>
                                </button>
                            </form>

                            {members.length > 0 && (
                                <div className="mt-8 pt-6 border-t border-stone-100">
                                    <p className="text-xs text-stone-400 mb-3 font-semibold uppercase tracking-wider text-center">Users in System ({members.length})</p>
                                    <div className="flex flex-wrap gap-2 justify-center max-h-36 overflow-y-auto no-scrollbar">
                                        {members.map(m => (
                                            <div
                                                key={m.id}
                                                className="px-3 py-1.5 bg-stone-100 text-stone-700 rounded-full text-xs font-semibold border border-stone-200 flex items-center space-x-1.5 cursor-default select-none"
                                            >
                                                <img src={m.avatar} alt={m.name} className="w-4 h-4 rounded-full object-cover" />
                                                <span>{m.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            const monthsList = [
                { index: 4, name: 'May 2027', days: 31, startDay: 6 },
                { index: 5, name: 'June 2027', days: 30, startDay: 2 },
                { index: 6, name: 'July 2027', days: 31, startDay: 4 },
                { index: 7, name: 'August 2027', days: 31, startDay: 0 },
                { index: 8, name: 'September 2027', days: 30, startDay: 3 },
                { index: 9, name: 'October 2027', days: 31, startDay: 5 },
            ];

            const currentMonthObj = monthsList.find(m => m.index === selectedMonth) || monthsList[0];
            const totalUnavailableDays = currentUser.unavailableDates.length;
            const seasonTotalDays = SEASON_DATES.length;
            const availableDaysCount = seasonTotalDays - totalUnavailableDays;
            const isAdmin = currentUser.name.toLowerCase() === 'admin';

            return (
                <div className="min-h-screen pb-24 max-w-2xl mx-auto bg-stone-50 shadow-2xl relative flex flex-col">
                    {successMessage && (
                        <div className="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 bg-stone-900/95 backdrop-blur text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 border border-stone-800 animate-bounce">
                            <i data-lucide="check-circle" className="w-5 h-5 text-orange-400"></i>
                            <span className="text-sm font-medium">{successMessage}</span>
                        </div>
                    )}

                    <header className="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-stone-200/80 px-4 py-3.5 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 bg-gradient-to-tr from-orange-500 to-amber-400 rounded-xl flex items-center justify-center text-white shadow-md shadow-orange-500/20">
                                <i data-lucide="palmtree" className="w-6 h-6"></i>
                            </div>
                            <div>
                                <h1 className="font-bold text-stone-900 text-lg leading-tight">PlanTogether</h1>
                                <p className="text-xs text-stone-500">May - Oct 2027 Vacation Finder</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-2">
                            <button
                                onClick={() => setActiveModal('userMenu')}
                                className="flex items-center space-x-2 bg-orange-50 hover:bg-orange-100 border border-orange-200 px-3 py-1.5 rounded-full transition-all"
                            >
                                <img src={currentUser.avatar} alt={currentUser.name} className="w-6 h-6 rounded-full object-cover border border-orange-300" />
                                <span className="text-xs font-bold text-orange-900 max-w-[90px] truncate">{currentUser.name}</span>
                                <i data-lucide="chevron-down" className="w-3.5 h-3.5 text-orange-700"></i>
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 px-4 py-5 overflow-y-auto">
                        {activeTab === 'calendar' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-br from-white to-orange-50/50 rounded-3xl p-5 border border-orange-100 shadow-sm">
                                    <div className="flex items-center justify-between mb-3">
                                        <div className="flex items-center space-x-3">
                                            <div className="p-3 bg-orange-500 text-white rounded-2xl shadow-md shadow-orange-500/20">
                                                <i data-lucide="calendar-off" className="w-6 h-6"></i>
                                            </div>
                                            <div>
                                                <h2 className="font-bold text-stone-900 text-base">Your Unavailable Dates</h2>
                                                <p className="text-xs text-stone-500">Tap dates when you are <span className="text-red-600 font-semibold">NOT</span> available</p>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-xl font-black text-orange-600">{availableDaysCount}</span>
                                            <p className="text-[10px] text-stone-400 uppercase tracking-wider font-bold">Days Free</p>
                                        </div>
                                    </div>

                                    <div className="flex flex-wrap gap-2 pt-2 border-t border-orange-100/60">
                                        <button
                                            onClick={() => handleQuickUnavailable('clear')}
                                            className="px-3 py-1.5 bg-white hover:bg-stone-100 text-stone-700 rounded-xl text-xs font-semibold border border-stone-200 shadow-xs flex items-center space-x-1 transition-all"
                                        >
                                            <i data-lucide="rotate-ccw" className="w-3.5 h-3.5 text-stone-500"></i>
                                            <span>Clear All</span>
                                        </button>
                                        <button
                                            onClick={() => handleQuickUnavailable('weekends')}
                                            className="px-3 py-1.5 bg-white hover:bg-orange-50 text-orange-700 rounded-xl text-xs font-semibold border border-orange-200 shadow-xs flex items-center space-x-1 transition-all"
                                        >
                                            <i data-lucide="briefcase" className="w-3.5 h-3.5 text-orange-500"></i>
                                            <span>Mark Weekends Busy</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="flex space-x-2 overflow-x-auto no-scrollbar pb-1">
                                    {monthsList.map(m => (
                                        <button
                                            key={m.index}
                                            onClick={() => setSelectedMonth(m.index)}
                                            className={`px-4 py-2.5 rounded-2xl font-bold text-xs whitespace-nowrap transition-all shadow-xs ${
                                                selectedMonth === m.index
                                                    ? 'bg-stone-900 text-white shadow-md'
                                                    : 'bg-white text-stone-600 hover:bg-stone-100 border border-stone-200'
                                            }`}
                                        >
                                            {m.name}
                                        </button>
                                    ))}
                                </div>

                                <div className="bg-white rounded-3xl p-5 border border-stone-200 shadow-sm">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="font-bold text-stone-800 text-lg">{currentMonthObj.name}</h3>
                                        <div className="flex items-center space-x-3 text-xs font-medium text-stone-500">
                                            <div className="flex items-center space-x-1">
                                                <span className="w-3 h-3 bg-red-500 rounded-full inline-block"></span>
                                                <span>Unavailable</span>
                                            </div>
                                            <div className="flex items-center space-x-1">
                                                <span className="w-3 h-3 bg-orange-100 border border-orange-300 rounded-full inline-block"></span>
                                                <span>Free</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-7 gap-1 text-center mb-2">
                                        {['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map((wd, i) => (
                                            <span key={i} className="text-[11px] font-bold text-stone-400 uppercase">{wd}</span>
                                        ))}
                                    </div>

                                    <div className="grid grid-cols-7 gap-1.5">
                                        {Array.from({ length: currentMonthObj.startDay }).map((_, i) => (
                                            <div key={`empty-${i}`} className="h-11"></div>
                                        ))}

                                        {Array.from({ length: currentMonthObj.days }).map((_, i) => {
                                            const dayNum = i + 1;
                                            const dateObj = new Date(2027, selectedMonth, dayNum);
                                            const dateStr = formatDateKey(dateObj);
                                            const isUnavailable = currentUser.unavailableDates.includes(dateStr);

                                            const othersUnavailable = members.filter(m => m.id !== currentUser.id && m.unavailableDates && m.unavailableDates.includes(dateStr)).length;
                                            const groupTotal = members.length;
                                            const freeCount = groupTotal - othersUnavailable - (isUnavailable ? 1 : 0);

                                            return (
                                                <button
                                                    key={dateStr}
                                                    onClick={() => toggleDateUnavailability(dateStr)}
                                                    className={`h-12 rounded-2xl flex flex-col items-center justify-center relative transition-all active:scale-95 ${
                                                        isUnavailable
                                                            ? 'bg-red-500 text-white font-bold shadow-md shadow-red-500/20 ring-2 ring-red-400'
                                                            : 'bg-orange-50/60 hover:bg-orange-100 text-stone-800 font-semibold border border-orange-100/80'
                                                    }`}
                                                >
                                                    <span className="text-sm leading-none">{dayNum}</span>
                                                    <span className={`text-[9px] mt-1 font-medium ${isUnavailable ? 'text-red-100' : 'text-stone-400'}`}>
                                                        {freeCount}/{groupTotal || 1} free
                                                    </span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-br from-white to-orange-50/50 rounded-3xl p-5 border border-orange-100 shadow-sm flex items-center justify-between">
                                    <div>
                                        <h2 className="font-bold text-stone-900 text-lg">Group Availability</h2>
                                        <p className="text-xs text-stone-500">Overview of all {members.length} friends in PlanTogether</p>
                                    </div>
                                    <div className="w-12 h-12 bg-orange-100 text-orange-600 rounded-2xl flex items-center justify-center font-black text-lg">
                                        {members.length}
                                    </div>
                                </div>

                                {members.length === 0 ? (
                                    <div className="bg-white rounded-3xl p-8 text-center border border-stone-200">
                                        <div className="w-16 h-16 bg-orange-100 text-orange-600 rounded-2xl flex items-center justify-center mx-auto mb-3">
                                            <i data-lucide="users" className="w-8 h-8"></i>
                                        </div>
                                        <h4 className="font-bold text-stone-800 text-base">No friends in the group yet</h4>
                                        <p className="text-stone-500 text-xs mt-1">Invite friends by having them log in with their name!</p>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {members.map(member => {
                                            const unavCount = member.unavailableDates ? member.unavailableDates.length : 0;
                                            const freeCount = seasonTotalDays - unavCount;
                                            const percentFree = Math.round((freeCount / seasonTotalDays) * 100);

                                            return (
                                                <div key={member.id} className="bg-white rounded-2xl p-4 border border-stone-200/80 shadow-xs flex items-center justify-between">
                                                    <div className="flex items-center space-x-3">
                                                        <img src={member.avatar} alt={member.name} className="w-11 h-11 rounded-full object-cover border-2 border-orange-200 shadow-xs" />
                                                        <div>
                                                            <div className="flex items-center space-x-2">
                                                                <h3 className="font-bold text-stone-800 text-sm">{member.name}</h3>
                                                                {member.id === currentUser.id && (
                                                                    <span className="px-2 py-0.5 bg-orange-100 text-orange-700 rounded-full text-[10px] font-bold">You</span>
                                                                )}
                                                            </div>
                                                            <p className="text-xs text-stone-500 mt-0.5">{unavCount === 0 ? 'Fully available all season!' : `${unavCount} days marked unavailable`}</p>
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center space-x-3">
                                                        <div className="text-right">
                                                            <span className="text-sm font-extrabold text-orange-600">{percentFree}%</span>
                                                            <p className="text-[10px] text-stone-400 uppercase font-semibold">Available</p>
                                                        </div>
                                                        {isAdmin && (
                                                            <button
                                                                onClick={(e) => handleDeleteUser(member.id, member.name, e)}
                                                                title="Delete User"
                                                                className="p-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl transition-colors"
                                                            >
                                                                <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'finder' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-br from-orange-600 to-amber-600 rounded-3xl p-6 text-white shadow-xl shadow-orange-500/20 space-y-5">
                                    <div className="flex items-center space-x-3">
                                        <div className="p-3 bg-white/20 backdrop-blur rounded-2xl">
                                            <i data-lucide="sparkles" className="w-6 h-6 text-white"></i>
                                        </div>
                                        <div>
                                            <p className="text-[10px] uppercase font-bold tracking-widest text-orange-200">Common Date Finder</p>
                                            <h2 className="font-extrabold text-xl leading-tight">Find dates when everyone is free</h2>
                                        </div>
                                    </div>
                                    <p className="text-orange-100 text-xs">We calculate the best vacation ranges based on group member calendars.</p>

                                    {/* MINIMUM VACATION DURATION */}
                                    <div className="space-y-2 pt-2 border-t border-white/20">
                                        <label className="block text-[11px] font-bold tracking-wider uppercase text-orange-200">Minimum Vacation Duration</label>
                                        <div className="flex flex-wrap gap-2">
                                            {[3, 5, 7, 10, 14].map(days => (
                                                <button
                                                    key={days}
                                                    onClick={() => setMinDuration(days)}
                                                    className={`px-3.5 py-2 rounded-full text-xs font-bold transition-all shadow-xs ${
                                                        minDuration === days
                                                            ? 'bg-white text-orange-700 shadow-md ring-2 ring-white/50'
                                                            : 'bg-white/10 hover:bg-white/20 text-white border border-white/20'
                                                    }`}
                                                >
                                                    {days} days
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* WHO SHOULD BE AVAILABLE? */}
                                    <div className="space-y-2 pt-1">
                                        <label className="block text-[11px] font-bold tracking-wider uppercase text-orange-200">Who Should Be Available?</label>
                                        <div className="flex flex-wrap gap-2">
                                            {[
                                                { id: 'all', label: 'Everybody' },
                                                { id: '5', label: 'At least 5' },
                                                { id: '4', label: 'At least 4' }
                                            ].map(item => (
                                                <button
                                                    key={item.id}
                                                    onClick={() => setMinAttendance(item.id)}
                                                    className={`px-4 py-2 rounded-full text-xs font-bold transition-all shadow-xs ${
                                                        minAttendance === item.id
                                                            ? 'bg-white text-orange-700 shadow-md ring-2 ring-white/50'
                                                            : 'bg-white/10 hover:bg-white/20 text-white border border-white/20'
                                                    }`}
                                                >
                                                    {item.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <div className="flex items-center justify-between px-1">
                                        <h3 className="font-bold text-stone-800 text-sm uppercase tracking-wider">Matching Date Ranges</h3>
                                        <span className="text-xs font-bold text-stone-500">{commonDateRanges.length} options found</span>
                                    </div>

                                    {commonDateRanges.length === 0 ? (
                                        <div className="bg-white rounded-3xl p-8 text-center border border-stone-200">
                                            <div className="w-16 h-16 bg-orange-100 text-orange-600 rounded-2xl flex items-center justify-center mx-auto mb-3">
                                                <i data-lucide="frown" className="w-8 h-8"></i>
                                            </div>
                                            <h4 className="font-bold text-stone-800 text-base">No dates match these filters</h4>
                                            <p className="text-stone-500 text-xs mt-1">Try lowering the minimum vacation duration or attendance criteria!</p>
                                        </div>
                                    ) : (
                                        commonDateRanges.slice(0, 6).map((range, idx) => {
                                            const options = { month: 'short', day: 'numeric' };
                                            const startStr = range.start.toLocaleDateString('en-US', options);
                                            const endStr = range.end.toLocaleDateString('en-US', options);

                                            return (
                                                <div key={idx} className="bg-white rounded-3xl p-5 border border-stone-200 shadow-sm relative overflow-hidden flex items-center justify-between">
                                                    {idx === 0 && (
                                                        <div className="absolute top-0 right-0 bg-gradient-to-l from-orange-500 to-amber-500 text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl uppercase tracking-wider shadow-xs">
                                                            Best Match
                                                        </div>
                                                    )}
                                                    <div className="flex items-center space-x-4">
                                                        <div className={`w-12 h-12 rounded-2xl flex items-center justify-center font-black text-base shadow-sm ${
                                                            idx === 0 ? 'bg-orange-500 text-white' : 'bg-orange-100 text-orange-700'
                                                        }`}>
                                                            #{idx + 1}
                                                        </div>
                                                        <div>
                                                            <h4 className="font-black text-stone-900 text-lg">{startStr} – {endStr}</h4>
                                                            <div className="flex items-center space-x-2 mt-1">
                                                                <span className="px-2 py-0.5 bg-orange-50 text-orange-700 border border-orange-200 rounded-full text-xs font-bold">
                                                                    {range.count} days duration
                                                                </span>
                                                                <span className="text-xs text-stone-500 font-medium">
                                                                    {minAttendance === 'all' ? 'Everybody free!' : `Flexible filter active`}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 max-w-2xl mx-auto bg-white/90 backdrop-blur-md border-t border-stone-200/80 px-6 py-2.5 flex justify-around items-center z-40 shadow-lg">
                        <button
                            onClick={() => setActiveTab('calendar')}
                            className={`flex flex-col items-center space-y-1 transition-colors ${
                                activeTab === 'calendar' ? 'text-orange-600 font-bold' : 'text-stone-400 hover:text-stone-600'
                            }`}
                        >
                            <i data-lucide="calendar" className="w-6 h-6"></i>
                            <span className="text-[10px]">My Calendar</span>
                        </button>

                        <button
                            onClick={() => setActiveTab('dashboard')}
                            className={`flex flex-col items-center space-y-1 transition-colors ${
                                activeTab === 'dashboard' ? 'text-orange-600 font-bold' : 'text-stone-400 hover:text-stone-600'
                            }`}
                        >
                            <i data-lucide="users" className="w-6 h-6"></i>
                            <span className="text-[10px]">Group</span>
                        </button>

                        <button
                            onClick={() => setActiveTab('finder')}
                            className={`flex flex-col items-center space-y-1 transition-colors ${
                                activeTab === 'finder' ? 'text-orange-600 font-bold' : 'text-stone-400 hover:text-stone-600'
                            }`}
                        >
                            <i data-lucide="sparkles" className="w-6 h-6"></i>
                            <span className="text-[10px]">Common Dates</span>
                        </button>
                    </nav>

                    {/* Personal-only Profile Menu (No Switch User, only Logout and Admin Reset) */}
                    {activeModal === 'userMenu' && (
                        <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl border border-stone-200 animate-in fade-in slide-in-from-bottom duration-200 text-center">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="font-bold text-stone-900 text-lg">My Profile</h3>
                                    <button onClick={() => setActiveModal(null)} className="p-2 text-stone-400 hover:text-stone-600 rounded-full">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <div className="flex flex-col items-center mb-6">
                                    <img src={currentUser.avatar} alt={currentUser.name} className="w-16 h-16 rounded-full object-cover border-2 border-orange-300 shadow-md mb-2" />
                                    <h4 className="font-bold text-stone-900 text-base">{currentUser.name}</h4>
                                    <p className="text-xs text-stone-500">{currentUser.unavailableDates.length} days marked unavailable</p>
                                </div>

                                <div className="space-y-2 pt-2 border-t border-stone-100">
                                    <button
                                        onClick={handleLogout}
                                        className="w-full py-3 bg-stone-100 hover:bg-stone-200 text-stone-800 font-bold rounded-2xl text-sm transition-colors flex items-center justify-center space-x-2"
                                    >
                                        <i data-lucide="log-out" className="w-4 h-4"></i>
                                        <span>Log Out</span>
                                    </button>
                                    
                                    {isAdmin && (
                                        <button
                                            onClick={() => setActiveModal('resetConfirm')}
                                            className="w-full py-2 bg-red-50 hover:bg-red-100 text-red-600 font-semibold rounded-2xl text-xs transition-colors flex items-center justify-center space-x-2"
                                        >
                                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                                            <span>Reset App Data</span>
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {activeModal === 'resetConfirm' && isAdmin && (
                        <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-stone-200 text-center">
                                <div className="w-16 h-16 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                    <i data-lucide="alert-triangle" className="w-8 h-8"></i>
                                </div>
                                <h3 className="font-bold text-stone-900 text-lg mb-1">Reset All Data?</h3>
                                <p className="text-stone-500 text-xs mb-6">This will clear all friend availability and reset the application back to defaults.</p>
                                <div className="flex space-x-3">
                                    <button
                                        onClick={() => setActiveModal('userMenu')}
                                        className="flex-1 py-3 bg-stone-100 hover:bg-stone-200 text-stone-800 font-bold rounded-2xl text-sm transition-colors"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={handleResetAll}
                                        className="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-2xl text-sm transition-colors shadow-lg shadow-red-600/30"
                                    >
                                        Confirm Reset
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
